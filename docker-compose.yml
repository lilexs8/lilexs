services:
  db:
    image: postgres:16
    container_name: ln1_postgres
    environment:
      POSTGRES_DB: ln1
      POSTGRES_USER: ln1
      POSTGRES_PASSWORD: ln1password
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: ln1_backend
    environment:
      DATABASE_URL: postgresql://ln1:ln1password@db:5432/ln1
      JWT_SECRET: change_this_secret
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: ln1_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
